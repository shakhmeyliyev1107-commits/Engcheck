[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engcheck"
version = "0.1.0"
description = "Muhandislik hujjatlarini tekshirish platformasi"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "argon2-cffi>=23.1",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "ezdxf>=1.3",
  "python-multipart>=0.0.9",
  "anthropic>=2.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]
keyring = ["keyring>=24"]
encryption = ["sqlcipher3-wheels>=0.5"]

[tool.setuptools.packages.find]
include = ["engcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
